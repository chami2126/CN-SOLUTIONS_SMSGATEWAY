<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNSMS Admin - Vercel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  
  <!-- Login Page -->
  <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-400">CNSMS Admin</h1>
        <p class="text-gray-400 mt-2">SMS Gateway Control Panel</p>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">Username</label>
          <input type="text" id="username" class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter username">
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-2">Password</label>
          <input type="password" id="password" class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter password">
        </div>
        
        <div id="loginError" class="hidden bg-red-500/20 border border-red-500 text-red-300 px-4 py-2 rounded-lg text-sm"></div>
        
        <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-semibold transition">
          Login
        </button>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-blue-400">CNSMS Dashboard</h1>
          <p class="text-gray-400">Send SMS via Dialog E-SMS Gateway</p>
        </div>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-semibold transition">
          Logout
        </button>
      </div>

      <!-- Send SMS Form -->
      <div class="bg-gray-800 p-6 rounded-xl mb-6">
        <h2 class="text-xl font-bold mb-4">Send SMS</h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">Phone Number</label>
            <input type="text" id="phoneNumber" class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="947XXXXXXXX">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-2">Message</label>
            <textarea id="message" rows="4" class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Type your message here..."></textarea>
          </div>
          
          <div id="smsError" class="hidden bg-red-500/20 border border-red-500 text-red-300 px-4 py-2 rounded-lg text-sm"></div>
          <div id="smsSuccess" class="hidden bg-green-500/20 border border-green-500 text-green-300 px-4 py-2 rounded-lg text-sm"></div>
          
          <button onclick="sendSMS()" id="sendBtn" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-semibold transition">
            Send SMS
          </button>
        </div>
      </div>

      <!-- Info Box -->
      <div class="bg-gray-800 p-6 rounded-xl">
        <h2 class="text-xl font-bold mb-4">API Status</h2>
        <div class="text-gray-400 text-sm">
          <p>✅ Vercel Function: <span class="text-green-400">Active</span></p>
          <p>✅ Dialog E-SMS: <span class="text-green-400">Connected</span></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = '/api/send-sms';

    // Check if already logged in
    if (localStorage.getItem('cnsms_logged_in')) {
      showDashboard();
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      if (!username || !password) {
        errorDiv.textContent = 'Please enter username and password';
        errorDiv.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, action: 'login' })
        });

        if (res.ok) {
          localStorage.setItem('cnsms_logged_in', 'true');
          showDashboard();
        } else {
          const data = await res.json();
          errorDiv.textContent = data.error || 'Invalid username or password';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = 'Login failed: ' + err.message;
        errorDiv.classList.remove('hidden');
      }
    }

    async function sendSMS() {
      const number = document.getElementById('phoneNumber').value;
      const message = document.getElementById('message').value;
      const errorDiv = document.getElementById('smsError');
      const successDiv = document.getElementById('smsSuccess');
      const sendBtn = document.getElementById('sendBtn');

      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      if (!number || !message) {
        errorDiv.textContent = 'Please enter phone number and message';
        errorDiv.classList.remove('hidden');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: 'admin',
            password: localStorage.getItem('cnsms_pass') || '1234',
            number,
            message,
            action: 'sms'
          })
        });

        const data = await res.json();

        if (res.ok) {
          successDiv.textContent = 'SMS sent successfully!';
          successDiv.classList.remove('hidden');
          document.getElementById('phoneNumber').value = '';
          document.getElementById('message').value = '';
        } else {
          errorDiv.textContent = data.error || 'Failed to send SMS';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = 'Error: ' + err.message;
        errorDiv.classList.remove('hidden');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send SMS';
      }
    }

    function showDashboard() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
    }

    function logout() {
      localStorage.removeItem('cnsms_logged_in');
      localStorage.removeItem('cnsms_pass');
      location.reload();
    }

    // Enter key support
    document.getElementById('password')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
